<div class="recent-quiz card">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <mat-icon class="header-icon">schedule</mat-icon>
      <h2 class="title">Recent Quiz Results</h2>
    </div>
  </div>

  <!-- Quiz List -->
  @if (quizzesWithTags.length > 0) {
    <div class="quiz-list">
      @for (quiz of quizzesWithTags; track quiz.quizName) {
        <div class="quiz-item">
          <div class="quiz-details">
            <div class="quiz-info">
              <h3>{{ quiz.quizName }}</h3>
              <p>{{ quiz.categoryName }}</p>
            </div>

            <div class="user-dashboard-tag">
              <app-tag [tagConfig]="quiz.tag"></app-tag>
            </div>
          </div>

          <div class="quiz-meta">
            <div class="quiz-score">
              <strong>{{ quiz.score }}%</strong>
              <strong>Score</strong>
            </div>
          </div>
        </div>
      }
    </div>
    @if (quizzesWithTags.length > 0) {
      <div class="footer user-dashboard-text-button">
        <app-text-button
          [textButtonConfig]="viewAllButtonConfig"
          (buttonClicked)="viewAll()"
        ></app-text-button>
      </div>
    }
  } @else {
    <div class="no-requests">
      <mat-icon>hourglass_empty</mat-icon>
      <p>No recent quiz results found.</p>
    </div>
  }
</div>
