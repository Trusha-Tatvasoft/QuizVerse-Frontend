<div class="main-dialog-content">
  <!-- Header -->
  <div class="dialog-header px-5 py-3 flex justify-between items-start">
    <div class="dialog-title-group">
      <h2 mat-dialog-title>Report Question Issue</h2>
      <span class="dialog-sub-header">
        Help us improve by reporting any issues with this question
      </span>
    </div>

    <!-- Close Button -->
    <button mat-icon-button class="close-btn-dialog-all" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form -->
  <form
    [formGroup]="reportForm"
    class="dialog-form custom-form-field-override custom-form-icon-override"
    (ngSubmit)="onSubmit()"
  >
    <div class="form-fields">
      <!-- Question (readonly) -->
      <div class="form-field">
        <label class="field-label">Question</label>
        <mat-form-field appearance="outline" class="custom-form-field full-width">
          <mat-icon fontSet="material-icons-outlined" matPrefix>help</mat-icon>
          <input matInput [value]="data.questionText" readonly />
        </mat-form-field>
      </div>

      <!-- Dynamic Fields -->
      @for (field of formFields; track field.name) {
        <div class="form-field">
          <label class="field-label">{{ field.label }}</label>

          <mat-form-field appearance="outline" class="custom-form-field-text full-width">
            <mat-icon fontSet="material-icons-outlined" matPrefix>
              {{ field.icon || 'report' }}
            </mat-icon>

            <textarea
              matInput
              [id]="field.name"
              [formControlName]="field.name"
              [placeholder]="field.placeholder"
              rows="3"
              [readonly]="data.reportId != null && !data.isEditable"
              class="min-h-[50px]"
            ></textarea>

            <mat-error>
              {{ getError(field.name) }}
            </mat-error>
          </mat-form-field>
        </div>
      }
    </div>

    <!-- Actions -->
    <mat-dialog-actions class="dialog-actions flex justify-end gap-3 p-0">
      <app-outline-button [outlineButtonConfig]="cancelButton" (buttonClicked)="onCancel()">
      </app-outline-button>

      @if (data.isEditable) {
        <!-- Editable Mode -->
        <app-filled-button [filledButtonConfig]="submitButton" class="w-auto"> </app-filled-button>
      } @else {
        <!-- Readonly / Under Review Mode -->
        <app-filled-button
          [filledButtonConfig]="data.reportId != null ? disabledSubmitButton : submitButton"
          class="w-auto"
          [matTooltip]="data.reportId != null ? 'Reported Question — Under Review' : ''"
        >
        </app-filled-button>
      }
    </mat-dialog-actions>
  </form>
</div>
