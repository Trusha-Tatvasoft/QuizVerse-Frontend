<main class="player-management-page">
  <div class="player-page-heading">
    <app-page-header
      [icon]="battleHeaderConfig.icon"
      [title]="battleHeaderConfig.title"
      [subtitle]="battleHeaderConfig.subtitle"
      [theme]="battleHeaderConfig.theme"
    ></app-page-header>
  </div>

  <div class="leaderboard-tabs">
    <app-common-tab
      [tabs]="tabs"
      [selectedIndex]="selectedIndex"
      (tabChanged)="onTabChanged($event)"
    >
    </app-common-tab>
  </div>
</main>
