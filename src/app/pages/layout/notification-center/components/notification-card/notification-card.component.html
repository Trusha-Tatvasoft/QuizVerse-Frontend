<div class="bg-white px-5 py-5">
  <div class="notification-inner">
    @if (notifications().length === 0) {
      <div class="p-4">
        <p class="text-gray-500 text-center text-sm mt-2">No new notifications.</p>
      </div>
    }

    @for (notif of notifications(); track notif.id) {
      <div
        class="rounded-lg shadow-sm px-4 py-3 mb-3 border"
        [ngClass]="
          notif.read
            ? 'hover:bg-white bg-gray-50 border-gray-200'
            : 'hover:bg-gray-50 transition-colors bg-[#eff6ff80] border border-[#bfdbfe]'
        "
      >
        <!-- Title + Tag -->
        <div class="flex justify-between flex-col md:flex-row md:items-center">
          <div class="flex items-center justify-between md:justify-start gap-2 w-full md:w-auto">
            <div>
              <span class="font-medium sm:text-lg text-medium">{{ notif.title }}</span>
              @if (!notif.read) {
                <span class="ps-3 text-blue-500 text-lg">●</span>
              }
            </div>
            <app-tag
              [tagConfig]="notif.tagConfig"
              class="flex justify-end md:justify-start"
            ></app-tag>
          </div>

          <!-- Action Buttons (desktop) -->
          <div class="hidden md:flex items-center gap-1">
            @if (!notif.read) {
              <app-text-button
                [textButtonConfig]="markAsReadButton"
                (buttonClicked)="markAsRead(notif.id)"
                matTooltip="Mark As Read"
              ></app-text-button>
            }
            <app-text-button
              [textButtonConfig]="deleteButton"
              (buttonClicked)="deleteNotification(notif.id)"
              matTooltip="Delete Notification"
            ></app-text-button>
          </div>
        </div>

        <!-- Message -->
        <p class="sm:text-[15px] text-[14px] text-gray-600 mt-1 pb-3">{{ notif.message }}</p>

        <!-- Footer -->
        <div class="flex justify-between items-center mt-1.5 flex-col md:flex-row gap-4 w-full">
          <div class="flex justify-start w-full">
            <span class="text-[14px] font-normal text-gray-600">
              {{ notif.timeAgo | date: 'yyyy-MM-dd HH:mm' }}<span class="px-2">●</span
              >{{ notif.category }}
            </span>
          </div>

          <!-- Action Buttons (mobile) + view details -->
          <div class="flex min-[300px]:justify-between max-[372px]:flex-col w-full gap-3">
            <app-outline-button
              [outlineButtonConfig]="viewDetailsButton"
              class="md:w-full flex justify-end max-[372px]:justify-start notification-center-view"
              (buttonClicked)="viewDetails(notif.categoryValue)"
            ></app-outline-button>

            <div class="flex md:hidden items-center gap-3 md:w-[0px] max-[372px]:justify-center">
              @if (!notif.read) {
                <app-text-button
                  class="notification-center-view max-[372px]:w-full"
                  [textButtonConfig]="markAsReadButton"
                  (buttonClicked)="markAsRead(notif.id)"
                  matTooltip="Mark As Read"
                ></app-text-button>
              }
              <app-text-button
                class="notification-center-view max-[372px]:w-full"
                [textButtonConfig]="deleteButton"
                (buttonClicked)="deleteNotification(notif.id)"
                matTooltip="Delete Notification"
              ></app-text-button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
