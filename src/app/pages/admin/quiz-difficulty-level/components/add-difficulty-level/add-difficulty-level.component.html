<div class="main-dialog-content">
  <!-- Header -->
  <div class="dialog-header px-5 py-3">
    <h2 mat-dialog-title>Add New Difficulty Level</h2>
    <span class="dialog-sub-header">Create a new difficulty level for quizzes</span>
  </div>

  <button mat-icon-button class="close-btn-dialog-all" (click)="onCancel()">
    <mat-icon>close</mat-icon>
  </button>

  <!-- Form -->
  <form [formGroup]="difficultyForm" class="p-5" (ngSubmit)="onSubmit()">
    <div class="grid gap-3 pb-3">
      @for (field of difficultyFields; track field.name) {
        <div class="form-field">
          <mat-label class="mb-2">{{ field.label }}</mat-label>

          <mat-form-field
            [ngClass]="[
              field.type === 'textarea' ? 'custom-form-field-text' : 'custom-form-field',
              'full-width',
              'mt-3',
            ]"
            appearance="outline"
            floatLabel="auto"
          >
            <mat-icon fontSet="material-icons-outlined" matPrefix>
              {{ field.icon || 'person' }}
            </mat-icon>

            @if (field.type === 'textarea') {
              <textarea
                matInput
                [id]="field.name"
                [formControlName]="field.name"
                [placeholder]="field.placeholder"
                rows="3"
              ></textarea>
            } @else {
              <input
                matInput
                [id]="field.name"
                [type]="field.type"
                [formControlName]="field.name"
                [placeholder]="field.placeholder"
                autocomplete="off"
                (blur)="field.name === 'name' && validateName()"
              />
            }

            <mat-error>
              {{ getError(field.name) }}
            </mat-error>
          </mat-form-field>
        </div>
      }
    </div>

    <!-- Actions -->
    <mat-dialog-actions class="dialog-actions flex justify-end gap-3 p-0">
      <app-outline-button
        [outlineButtonConfig]="cancelButton"
        (buttonClicked)="onCancel()"
      ></app-outline-button>

      <app-filled-button [filledButtonConfig]="addButton" class="w-auto"></app-filled-button>
    </mat-dialog-actions>
  </form>
</div>
