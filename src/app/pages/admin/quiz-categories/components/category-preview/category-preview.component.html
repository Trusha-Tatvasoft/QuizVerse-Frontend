<div class="main-dialog-content">
  <div class="dialog-header">
    <div class="dialog-title-group">
      <h2 mat-dialog-title>Category Preview</h2>
    </div>
    <button type="button" class="close-button" (click)="onClose()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div class="dialog-body">
    <div class="category-header">
      <!-- Left: Icon -->
      <mat-icon class="category-icon">
        {{ data.icon || 'category' }}
      </mat-icon>

      <!-- Middle: Category Name -->
      <div class="category-info">
        <h3>{{ data.categoryName }}</h3>

        @if (data.isActive) {
          <app-tag [tagConfig]="ActiveTagConfig"></app-tag>
        } @else {
          <app-tag [tagConfig]="InActiveTagConfig"></app-tag>
        }
      </div>
    </div>

    <!-- Description -->
    <div class="category-description">
      <p class="label">Description:</p>
      <p>{{ data.description }}</p>
    </div>

    <!-- Quiz Count + Created Date -->
    <div class="meta-grid">
      <div>
        <p class="label">Quiz Count:</p>
        <p>{{ data.quizCount }} quizzes</p>
      </div>
      <div>
        <p class="label">Created:</p>
        <p>{{ formatedDate }}</p>
      </div>
    </div>
  </div>
</div>
