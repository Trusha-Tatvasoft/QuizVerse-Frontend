<form [formGroup]="loginForm" class="login-form" (ngSubmit)="onSubmit()">
  @for (field of loginFields; track field.name) {
    <div class="form-field mb-2">
      @if (field.type === 'checkbox') {
        <div class="flex items-center justify-between">
          <div class="remember-me-wrapper">
            <mat-checkbox [formControlName]="field.name" class="remember-me-checkbox">
              {{ field.label }}
            </mat-checkbox>
          </div>
          <a class="forgot-password" routerLink="/forgot-password">Forgot password?</a>
        </div>
      } @else {
        <mat-label>{{ field.label }}</mat-label>

        <mat-form-field
          class="custom-form-field full-width"
          appearance="outline"
          [floatLabel]="'auto'"
        >
          <mat-icon fontSet="material-icons-outlined" matPrefix>{{
            field.icon || 'person'
          }}</mat-icon>

          <input
            #fieldRef
            matInput
            [id]="field.name"
            [type]="field.type"
            [formControlName]="field.name"
            [placeholder]="field.placeholder"
            [autocomplete]="field.name === 'password' ? 'current-password' : 'email'"
            required
          />

          @if (field.type === 'password') {
            <mat-icon
              fontSet="material-icons-outlined"
              [appTogglePassword]="fieldRef"
              matSuffix
              class="password-toggle-icon"
              style="cursor: pointer"
              aria-label="Toggle password visibility"
            >
              visibility_off
            </mat-icon>
          }

          <mat-error>
            {{ getError(field.name) }}
          </mat-error>
        </mat-form-field>
      }
    </div>
  }

  <app-filled-button [filledButtonConfig]="signInButton" class="signin-button"> </app-filled-button>
</form>
